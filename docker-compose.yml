services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fullstack_project
      POSTGRES_PASSWORD: app
      POSTGRES_USER: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fullstack_project"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
